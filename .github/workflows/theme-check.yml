name: Verify theme

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # Installeras bara i CI-jobbet. Temat självt förblir build-fritt.
      - name: Install Shopify CLI
        run: npm install -g @shopify/cli@5.0.1
      - name: Run verification
        run: bash scripts/verify.sh
        env:
          SHOPIFY_CLI_NO_ANALYTICS: "1"
