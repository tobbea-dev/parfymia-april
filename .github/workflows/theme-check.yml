name: Theme check

on:
  pull_request:
  push:
    branches: [main, prod]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Installera Shopify CLI
        run: npm install -g @shopify/cli@latest
      - name: Verifiera tema
        run: scripts/verify.sh
